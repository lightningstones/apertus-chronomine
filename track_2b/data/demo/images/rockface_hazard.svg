<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="rock-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <pattern id="cracks" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 5,5 L 25,25 L 15,45 L 35,55" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
      <path d="M 45,5 L 35,30 L 50,45" fill="none" stroke="#dc2626" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Subterranean Rock Cavern Background -->
  <rect width="600" height="400" fill="url(#rock-grad)"/>
  <rect width="600" height="400" fill="url(#cracks)"/>

  <!-- Tunnel Profile Arch -->
  <path d="M 80,380 L 80,180 Q 300,40 520,180 L 520,380 Z" fill="#171717" stroke="#78716c" stroke-width="4"/>

  <!-- Unstable Rock Crown / Vault Fault (SIA 198) -->
  <path d="M 220,100 Q 300,120 380,90 Q 340,150 300,160 Q 260,150 220,100 Z" fill="#44403c" stroke="#dc2626" stroke-width="3" stroke-dasharray="5"/>
  <polygon points="260,140 280,190 270,195 250,145" fill="#78716c" stroke="#ef4444" stroke-width="2"/>
  <polygon points="320,135 345,185 335,190 310,140" fill="#78716c" stroke="#ef4444" stroke-width="2"/>

  <!-- Hazard callout -->
  <rect x="180" y="20" width="240" height="36" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="300" y="44" fill="#fef2f2" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⚠️ INSTABILITÉ VOÛTE — SIA 198</text>

  <!-- Missing Rockbolts / Anchors Callout -->
  <line x1="200" y1="130" x2="130" y2="100" stroke="#f59e0b" stroke-width="2"/>
  <text x="125" y="90" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">ANCRAGES MANQUANTS</text>
  <text x="125" y="105" fill="#a8a29e" font-family="sans-serif" font-size="10" text-anchor="end">Absence de boulons d'ancrage</text>

  <!-- Water seepage -->
  <path d="M 370,110 Q 375,150 380,220" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4"/>
  <text x="390" y="160" fill="#38bdf8" font-family="sans-serif" font-size="11">Venue d'eau sous pression</text>

  <!-- Worker underneath hazardous zone -->
  <g transform="translate(290, 310)">
    <!-- Helmet -->
    <ellipse cx="10" cy="10" rx="10" ry="7" fill="#facc15"/>
    <!-- Body -->
    <rect x="3" y="18" width="14" height="28" fill="#ea580c"/>
    <line x1="10" y1="46" x2="2" y2="70" stroke="#000" stroke-width="4"/>
    <line x1="10" y1="46" x2="18" y2="70" stroke="#000" stroke-width="4"/>
  </g>

  <!-- Danger Zone Boundary on Ground -->
  <ellipse cx="300" cy="375" rx="90" ry="15" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6"/>
  <text x="300" y="392" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ZONE D'EXCLUSION NON DÉLIMITÉE</text>

  <!-- Stop work stamp -->
  <rect x="420" y="280" width="160" height="50" rx="8" fill="#991b1b" stroke="#f87171" stroke-width="2"/>
  <text x="500" y="302" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">STOPP SUVA</text>
  <text x="500" y="320" fill="#fecaca" font-family="sans-serif" font-size="10" text-anchor="middle">BauAV Art. 3 / SIA 198</text>
</svg>
