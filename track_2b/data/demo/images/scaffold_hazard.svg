<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Shaft Deep Underground Background -->
  <rect width="600" height="400" fill="#0f172a"/>

  <!-- Shaft walls -->
  <rect x="50" y="0" width="30" height="400" fill="#334155"/>
  <rect x="520" y="0" width="30" height="400" fill="#334155"/>

  <!-- Intermediate platform (Tiefe 45m) -->
  <rect x="80" y="240" width="440" height="20" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
  <line x1="80" y1="260" x2="160" y2="400" stroke="#475569" stroke-width="6"/>
  <line x1="520" y1="260" x2="440" y2="400" stroke="#475569" stroke-width="6"/>

  <!-- Defective Scaffolding (Missing toeboard & top rail on west side) -->
  <line x1="120" y1="240" x2="120" y2="160" stroke="#f59e0b" stroke-width="4"/>
  <line x1="280" y1="240" x2="280" y2="160" stroke="#f59e0b" stroke-width="4"/>
  
  <!-- Missing top rail indicator (red dash) -->
  <line x1="120" y1="160" x2="280" y2="160" stroke="#ef4444" stroke-width="3" stroke-dasharray="6"/>
  <text x="140" y="150" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="bold">⚠️ LISSE HAUTE MANQUANTE</text>
  <text x="140" y="235" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">⚠️ SANS BORDBRETT (PLINTHE)</text>

  <!-- Void / Drop indicator -->
  <text x="360" y="320" fill="#f87171" font-family="sans-serif" font-size="14" font-weight="bold">VIDE : CHUTE &gt; 40 MÈTRES</text>

  <!-- Red STOPP Banner -->
  <rect x="20" y="20" width="560" height="48" rx="8" fill="#991b1b" stroke="#f87171" stroke-width="2"/>
  <text x="40" y="50" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">⛔ SUVA ALERTE : VIOLATION CRITIQUE BAUAV ART. 15</text>
  <text x="440" y="50" fill="#fef08a" font-family="sans-serif" font-size="13" font-weight="bold">DANGER DE CHUTE</text>
</svg>
