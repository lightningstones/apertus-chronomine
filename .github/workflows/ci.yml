name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit & Integration Tests (Air-Gapped Mode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r track_2b/requirements.txt
          pip install pytest reportlab

      - name: Run test suite
        env:
          APERTUS_PROVIDER: mock_offline
        run: |
          pytest track_2b/tests/ -v

      - name: Verify Technical Report PDF existence & page limit
        run: |
          python -c "
          import os, re
          pdf_path = 'track_2b/ChronoMine_Report.pdf'
          assert os.path.exists(pdf_path), 'Missing ChronoMine_Report.pdf!'
          data = open(pdf_path, 'rb').read()
          pages = len(re.findall(b'/Type\s*/Page[^s]', data))
          print(f'Report exists: {pages} pages (max 6 allowed)')
          assert pages <= 6, f'Report has {pages} pages, which exceeds the 6-page limit!'
          "

  docker-build:
    name: Docker Container Build Verification (make run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        run: |
          docker compose -f track_2b/docker-compose.yml build
